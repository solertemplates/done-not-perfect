name: Render episodio

on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "JSON del episodio"
        required: true
        default: "episodios/ep01_la_silla.json"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Renderizar y verificar
        env:
          EPISODIO: ${{ inputs.episodio }}
        run: python -m dnp.render "$EPISODIO" --salida salida --capturas 0,8,16

      - name: Subir MP4 y miniatura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodio
          path: |
            salida/*.mp4
            salida/miniatura.png
            salida/informe.txt
          if-no-files-found: error
          retention-days: 30

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: salida/captura_*.png
          if-no-files-found: ignore
          retention-days: 30
