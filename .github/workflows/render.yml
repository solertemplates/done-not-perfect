name: Render episodio

on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "Episodio"
        required: true
        type: choice
        default: "episodios/ep03_los_dos_martillos.json"
        options:
          - "episodios/ep01_la_silla.json"
          - "episodios/ep02_la_escalera.json"
          - "episodios/ep03_los_dos_martillos.json"

permissions:
  contents: write  # necesario para guardar el vídeo en main

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Renderizar y verificar
        env:
          EPISODIO: ${{ inputs.episodio }}
        run: python -m dnp.render "$EPISODIO" --salida salida --capturas 0,8,16

      - name: Guardar MP4 y miniatura en /videos de main
        env:
          EPISODIO: ${{ inputs.episodio }}
        run: |
          read -r ID NUM < <(python -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); print(d['id'], d['episodio'])" "$EPISODIO")
          read -r FECHA HORA < <(date -u '+%Y-%m-%d %H:%M')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Siempre sobre la última main, aunque el workflow se lance desde otra rama.
          for intento in 1 2 3 4; do
            git fetch --quiet origin main
            git checkout --quiet -B publicar origin/main
            mkdir -p videos
            cp "salida/${ID}.mp4" "videos/${ID}.mp4"
            cp salida/miniatura.png "videos/${ID}_miniatura.png"
            git add "videos/${ID}.mp4" "videos/${ID}_miniatura.png"
            if git diff --cached --quiet; then
              echo "El vídeo ya estaba guardado y no ha cambiado."
              break
            fi
            git commit --quiet -m "Episodio ${NUM}: vídeo renderizado el ${FECHA} ${HORA} UTC" \
              -m "Generado por el workflow Render episodio (ejecución ${GITHUB_RUN_ID}) desde ${GITHUB_SHA}."
            if git push --quiet origin HEAD:main; then
              break
            fi
            if [ "$intento" = 4 ]; then
              echo "No se pudo guardar el vídeo en main." >&2
              exit 1
            fi
            sleep $((intento * 5))
          done
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/main/videos/${ID}.mp4"
          {
            echo
            echo "**Descarga directa del MP4:** ${URL}"
            echo
            echo "Miniatura: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/main/videos/${ID}_miniatura.png"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir MP4 y miniatura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episodio
          path: |
            salida/*.mp4
            salida/miniatura.png
            salida/informe.txt
          if-no-files-found: error
          retention-days: 30

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: salida/captura_*.png
          if-no-files-found: ignore
          retention-days: 30
